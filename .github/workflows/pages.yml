# Deploy the static site to GitHub Pages.
#
# The legacy Pages builder started failing with an undiagnosable "Page build
# failed" (duration 0) and pinned the live site to an old commit. Nothing here
# needs building — it is plain HTML/CSS/JS — so this uploads the repo as-is and
# deploys it, and any future failure shows up in the Actions log instead of a
# one-line API status.
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A single "pages" group deadlocked: one run got stuck in `waiting` and could
# not be cancelled (the API 502s on it), so every later deploy queued behind it
# forever and was eventually cancelled — the new computer never reached the
# site. Newest-wins instead. The github-pages environment already serialises
# actual deployments, so this only supersedes queued builds, and these runs
# take ~20s anyway.
concurrency:
  group: pages-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Stamp every local asset URL with the commit sha. Without this a returning
      # visitor can end up running a NEW script against a CACHED OLD one — which
      # is exactly how "Lowest" broke while "Random" kept working: only Lowest
      # called a function that had moved into a file the browser had cached.
      - name: Cache-bust local assets
        run: sed -i "s/?v=DEV/?v=${GITHUB_SHA::7}/g" index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
