<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a0f0a">
<title>Venture Lab</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Cinzel+Decorative:wght@400;700;900&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vendor/styles.css">
<style>
/* ---- Lab-only chrome. Everything else is the game's own styles.css. -------
   Deliberately built from the same CSS custom properties the board uses, so
   the lab bar reads as part of the table rather than bolted on. */
#lab-bar{
  position:fixed;top:0;left:0;right:0;z-index:6000;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  height:44px;padding:0 52px;
  background:rgba(26,15,10,.86);border-bottom:1px solid var(--felt-edge,rgba(212,168,67,.25));
  font-family:'Crimson Pro',Georgia,serif;
}
#lab-bar .lab-title{
  font-family:'Cinzel Decorative','Cinzel',serif;font-weight:700;
  color:var(--gold,#d4a843);letter-spacing:.06em;margin-right:6px;white-space:nowrap;
}
#lab-bar button,#lab-bar select{
  font:inherit;font-size:.86rem;color:var(--parchment,#e8dcc0);
  background:rgba(255,255,255,.06);border:1px solid rgba(212,168,67,.32);
  border-radius:6px;padding:3px 9px;cursor:pointer;
}
#lab-bar button:hover,#lab-bar select:hover{border-color:var(--gold,#d4a843)}
#lab-bar button.on{background:var(--gold,#d4a843);border-color:var(--gold,#d4a843);color:#241606;font-weight:600}
#lab-bar .lab-sep{flex:1}
/* The board sits under the fixed bar. */
#game-screen{padding-top:44px}  /* == LAB.topInset */

/* ---- Potential readout ---------------------------------------------------
   One label per colour per player, centred under its pile column. Positioned
   by lab.js from the same layout the renderer uses. */
#lab-potential-layer{position:absolute;inset:0;pointer-events:none;z-index:4600}
.lab-pot{
  position:absolute;transform:translate(-50%,2px);
  font-family:'Cinzel',Georgia,serif;font-size:.72rem;font-weight:700;
  letter-spacing:.04em;white-space:nowrap;opacity:.92;
  text-shadow:0 1px 3px rgba(0,0,0,.85);
}
.lab-pot.pos{color:var(--gold-bright,#f0c860)}
.lab-pot.neg{color:var(--danger,#c0605a)}
.lab-pot.zero{color:var(--parchment,#e8dcc0);opacity:.55}

/* The game's own corner buttons (back arrow, gear) sit at the screen corners
   and so collide with the lab bar. Neither does anything here — the bar
   replaces them — so they're hidden rather than left as dead overlapping UI. */
#game-screen .corner-btn{display:none}

#vc-deck{
  position:fixed;top:44px;right:4px;bottom:4px;z-index:5000;overflow:hidden;
  background:rgba(20,14,8,.9);border:1px solid #c0a030;border-radius:8px;padding:8px;
  box-shadow:0 4px 16px rgba(0,0,0,.5);
}
#vc-deck-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
#vc-deck-h{color:#c0a030;font:700 12px monospace}
#vc-deck-list{overflow:hidden}

#lab-flash{
  position:fixed;left:50%;top:46px;transform:translateX(-50%);z-index:7000;
  background:rgba(26,15,10,.94);border:1px solid var(--gold,#d4a843);border-radius:8px;
  color:var(--parchment,#e8dcc0);font-family:'Crimson Pro',Georgia,serif;font-size:.9rem;
  padding:6px 14px;opacity:0;pointer-events:none;transition:opacity .18s ease;
}
#lab-flash.on{opacity:1}
#lab-result{
  position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:7000;
  background:rgba(26,15,10,.96);border:1px solid var(--gold,#d4a843);border-radius:12px;
  color:var(--gold-bright,#f0c860);font-family:'Cinzel',Georgia,serif;font-size:1.35rem;
  padding:18px 34px;opacity:0;pointer-events:none;transition:opacity .25s ease;text-align:center;
}
#lab-result.on{opacity:1}
</style>
</head>
<body>

<!-- LAB CONTROL BAR — the only chrome that is not the game's own. -->
<div id="lab-bar">
  <span class="lab-title">Venture Lab</span>
  <button id="lab-new">New game</button>
  <select id="lab-ai" title="Opponent strength">
    <option value="casual">Opponent: Casual</option>
    <option value="solid" selected>Opponent: Solid</option>
    <option value="sharp">Opponent: Sharp</option>
  </select>
  <span class="lab-sep"></span>
  <button id="lab-deck" title="Draw pile as colour columns on the right">Deck columns</button>
  <button id="lab-opp" title="Opponent's hand face-up">Opponent hand</button>
  <button id="lab-pot" title="Per-colour potential under each pile">Potential</button>
</div>
<div id="game-screen" class="screen active">
  <span id="opponent-name-store" style="display:none">Opponent</span>

  <div class="board-area">
    <!-- Opponent name — its own flow row above the hand (leading = the spacing) -->
    <div id="hand_opp_name" class="hand-name-row"><span id="opp-name-tag" class="name-tag hand-name"></span></div>
    <!-- Opponent full hand (from the top edge) -->
    <div id="hand_opp" class="hand-peek"></div>

    <!-- Retired info row (rows dissolved): kept hidden so JS refs to opp-status /
         opp-total-score still resolve. Name moved onto the hand above. -->
    <div id="info_opp" class="info-row" style="display:none">
      <span id="opp-status" class="phase-prompt"></span>
      <span id="opp-total-score" class="total-score"></span>
    </div>

    <div class="card-row" id="play_opp"></div>

    <div id="middle-section" class="col-center" style="justify-content:center;width:100%">
      <div class="card-row" id="discard_draw"></div>
      <div id="draw-pile-slot" style="margin-top:var(--gap-sm)"></div>
      <div id="single-pile-area" style="display:none;margin-top:var(--gap-sm)"></div>
    </div>

    <div class="card-row" id="play_user"></div>

    <!-- Retired info row (rows dissolved): hidden so JS refs to phase-prompt /
         turn-timer-display / my-total-score still resolve. Name moved onto the
         hand below; the turn-timer moves to the bottom bar in the live-bar pass. -->
    <div id="info_user" class="info-row" style="display:none">
      <span id="phase-prompt" class="phase-prompt">Select a card</span>
      <span id="my-total-score" class="total-score"></span>
    </div>

    <!-- Player hand with glow when it's your turn -->
    <div class="hand-area" id="hand_user">
      <div class="hand-cards" id="hand-cards"></div>
    </div>
    <!-- Player name — its own flow row below the hand (leading = the spacing) -->
    <div id="hand_user_name" class="hand-name-row"><span id="my-name-tag" class="name-tag hand-name"></span></div>

    <!-- Card pool: 60 persistent card elements, positioned via four-corner transforms -->
    <div id="card-pool"></div>
  </div>

  <!-- Board back button (top-left, live only — replay has its own back-arrow).
       Confirms before abandoning the game. Same .corner-btn as every screen. -->
  <button class="corner-btn corner-left" id="board-back-btn" aria-label="Leave game" onclick="SFX.select();confirmAbandonGame()">&larr;</button>
  <!-- Floating gear menu button -->
  <button class="corner-btn corner-right" aria-label="Menu" onclick="SFX.select();showGameMenu()"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" aria-hidden="true"><use href="#icon-gear"/></svg></button>
  
  <!-- Unified bottom bar — ONE element for BOTH modes; .replay-mode on #game-screen
       picks the control group. Live: undo · turn indicator · timer. Replay: ‹ ·
       scrubber · › · n/N. Identical chrome either way. (The replay back-arrow + eye
       are floating corner buttons, not part of the bar.) -->
  <div id="bottom-bar">
    <div id="live-controls">
      <button id="floating-undo-btn" class="bar-icon-btn" aria-label="Undo" onclick="SFX.select();extendedUndo()" style="display:none"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform:rotate(-90deg) scaleX(-1)"><path d="M12 5a7 7 0 1 0 6.89 8.22"/><path d="M12 5 8.5 3.2M12 5l-1.2 3.7"/></svg></button>
      <span id="turn-indicator"></span>
      <span id="turn-timer-display" style="display:none"></span>
    </div>
    <div id="replay-controls">
      <button id="replay-step-back-btn" class="bar-icon-btn replay-step" title="Back one move" aria-label="Back one move"></button>
      <input id="replay-scrubber" class="replay-scrubber" type="range" min="0" max="0" value="0" step="1" aria-label="Replay position — drag to any move" title="Drag to any move">
      <button id="replay-step-fwd-btn" class="bar-icon-btn replay-step" title="Forward one move" aria-label="Forward one move"></button>
      <span id="replay-info" class="replay-info">0 / 0</span>
    </div>
  </div>

  <div id="spread-view" class="spread-view" onclick="spreadPile=null;document.getElementById('spread-view').classList.remove('active');renderBoard()">
    <div class="spread-view-cards" id="spread-view-cards" onclick="event.stopPropagation()"></div>
  </div>
  <div id="idle-overlay" style="position:absolute;inset:0;z-index:5100;background:rgba(53,42,17,.82);align-items:center;justify-content:center;flex-direction:column;cursor:pointer"></div>
</div>

<div id="lab-flash"></div>
<div id="lab-result"></div>

<!-- Vendored presentation stack — the live game's own client files, unchanged
     except for three clearly-marked LAB PATCH lines in rendering.js. -->
<script src="vendor/src/config.js"></script>
<script src="vendor/src/events.js"></script>
<script src="vendor/src/math.js"></script>
<script src="vendor/src/sections.js"></script>
<script src="vendor/src/rules.js"></script>
<script src="vendor/src/playable-targets.js"></script>
<script src="vendor/src/engine.js"></script>
<script src="vendor/src/sound.js"></script>
<script src="vendor/src/layout.js"></script>
<script src="vendor/src/constants.js"></script>
<script src="vendor/src/geometry.js"></script>
<script src="vendor/src/four-corner-renderer.js"></script>
<script src="vendor/src/animation-queue.js"></script>
<script src="vendor/src/text.js"></script>
<script src="vendor/src/hand-sort.js"></script>
<script src="vendor/src/rendering.js"></script>

<!-- The lab: game loop, offline opponent, perfect information, potential. -->
<script src="lab.js"></script>
</body>
</html>
